<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeux — Visual Archive</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
            background-color: #0b0b0b; /* 고급스러운 다크 블랙 배경 */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px 40px;
        }

        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        /* 중앙 로고 */
        .logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sub-title {
            font-size: 12px;
            color: #888888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        /* 메인 대표 대표 이미지 */
        .hero-image {
            width: 100%;
            height: 320px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 32px;
            border: 1px solid #222222;
        }

        /* 라운드 캡슐형 링크 버튼 그룹 */
        .link-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #161616;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 40px;
            border: 1px solid #282828;
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        .link-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        /* 하단 소셜 인스타그램/이메일 링크 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 36px;
        }

        .social-links a {
            color: #777777;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: #ffffff;
        }

        footer {
            font-size: 11px;
            color: #444444;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로고 및 상단 텍스트 -->
        <div class="logo">yeux</div>
        <div class="sub-title">Art & Visual Collection</div>

        <!-- 메인 커버 사진 (업로드하신 실제 사진 파일명으로 변경하세요) -->
        <img src="photo1.jpg" alt="yeux main visual" class="hero-image" onerror="this.src='https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=800'">

        <!-- 주요 메뉴 링크 버튼 -->
        <div class="link-group">
            <a href="#" class="link-btn">2026 VER COLLECTION</a>
            <a href="https://instagram.com" target="_blank" class="link-btn">INSTAGRAM ARCHIVE</a>
            <a href="mailto:your-email@example.com" class="link-btn">CONTACT / INQUIRY</a>
        </div>

        <!-- 소셜 / 이메일 단축 버튼 -->
        <div class="social-links">
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://pinterest.com" target="_blank">Pinterest</a>
            <a href="mailto:your-email@example.com">Email</a>
        </div>

        <footer>
            © yeux Archive. All rights reserved.
        </footer>
    </div>
</body>
</html>
